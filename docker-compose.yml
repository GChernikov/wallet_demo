services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: wallet_demo
      MYSQL_ALLOW_EMPTY_PASSWORD: yes
    ports:
      - "3306:3306"
    command: >
      --innodb-buffer-pool-size=1G
      --innodb-redo-log-capacity=1073741824
      --innodb-flush-log-at-trx-commit=1
      --innodb-flush-method=O_DIRECT
      --sync-binlog=1
      --max-connections=500
      --skip-name-resolve
      --innodb-thread-concurrency=0
      --performance-schema=ON
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - mysql_data:/var/lib/mysql

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      nats:
        condition: service_healthy
    environment:
      DB_DSN: root:@tcp(mysql:3306)/wallet_demo?parseTime=true
      NATS_URL: nats://nats:4222

volumes:
  mysql_data:
